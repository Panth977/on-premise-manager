name: cloud-image

# The OPM cloud image (selfhost/Dockerfile) on the GitHub container registry:
#   ghcr.io/<owner>/on-premise-manager:<branch|tag>  and  :<branch|tag>-<short sha>  (+ :latest from main)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          img="ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
          ref="$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd 'A-Za-z0-9_.-')"
          sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          tags="${img}:${ref},${img}:${ref}-${sha}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then tags="${tags},${img}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: selfhost/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=opm-cloud
          cache-to: type=gha,mode=max,scope=opm-cloud

      - run: echo "${{ steps.build.outputs.digest }}"
