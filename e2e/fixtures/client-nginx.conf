worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Increase request size limit
    client_max_body_size 100M;
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;

    server {
        listen 443 ssl;
        listen 80;
        server_name env.client.example.gov.in;

        ssl_certificate /etc/nginx/certs/client.crt;
        ssl_certificate_key /etc/nginx/certs/client.key;

        # Headers to disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        ### General Proxy Settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_http_version 1.1;

        location /x/ez-apis/ {
            rewrite ^/x/ez-apis(/.*)$ $1 break;
            proxy_pass http://ez-integration:8080;
        }
        location /x/ez-dc-worker/ {
            rewrite ^/x/ez-dc-worker(/.*)$ $1 break;
            proxy_pass http://ez-dc:8080;
        }
        location /x/ez-worker/ {
            rewrite ^/x/ez-worker(/.*)$ $1 break;
            proxy_pass http://ez-worker:8080;
        }
        location /x/ez-pg-listen/ {
            rewrite ^/x/ez-pg-listen(/.*)$ $1 break;
            proxy_pass http://ez-pg-listen:8080;
        }
        # SSE
        location /x/ez-terminal/real-time/ {
            rewrite ^/x/ez-terminal(/.*)$ $1 break;
            proxy_pass http://ez-terminal:8080;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        # small S3-like store
        location /x/ez-terminal/s3/ {
            rewrite ^/x/ez-terminal(/.*)$ $1 break;
            proxy_pass http://ez-terminal:8080;
            proxy_pass_request_headers on;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }
        location /x/ez-terminal/ {
            rewrite ^/x/ez-terminal(/.*)$ $1 break;
            proxy_pass http://ez-terminal:8080;
        }
        location /x/ez-migrate/ {
            rewrite ^/x/ez-migrate(/.*)$ $1 break;
            proxy_pass http://ez-migrate:8080;
        }
        location /x/ez-admin/real-time/ {
            rewrite ^/x/ez-admin(/.*)$ $1 break;
            proxy_pass http://ez-admin:8080;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        location /x/ez-admin/s3/ {
            rewrite ^/x/ez-admin(/.*)$ $1 break;
            proxy_pass http://ez-admin:8080;
            proxy_pass_request_headers on;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }
        location /x/ez-admin/ {
            rewrite ^/x/ez-admin(/.*)$ $1 break;
            proxy_pass http://ez-admin:8080;
        }
        location /x/admin/ {
            rewrite ^/x/admin(/.*)$ $1 break;
            proxy_pass http://northwind-admin:3000;
        }
        location /x/ez-heatmap/ {
            rewrite ^/x/ez-heatmap(/.*)$ $1 break;
            proxy_pass http://ez-heatmap:8080;
        }
        location /x/pg-admin/ {
            proxy_pass http://pg-admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /x/pg-admin;
        }
        location /x/nodered/ {
            rewrite ^/x/nodered(/.*)$ $1 break;
            proxy_pass http://nodered:1880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            resolver 127.0.0.11 valid=30s;
        }
        location /swagger/ {
            proxy_pass http://ez-integration:8080;
        }
        location /apis/ {
            rewrite ^/apis(/.*)$ $1 break;
            proxy_pass http://ez-integration:8080;
        }
        location ~ ^/apis/(docs|_docs_/[^/]+)$ {
            return 301 $uri/$is_args$args;
        }
        location / {
            proxy_pass http://northwind-web:80;
        }
        location /api/v0002/device/types {
            rewrite ^ /x/nodered$request_uri last;
        }
    }
}
